adapters:
  store: json          # json | feishu
  notifier: cli        # cli | feishu
  router: cli          # cli | feishu_webhook（飞书模式入站由外部网关转发，通常仍填 cli）

workspace_dir: ./workspace/tasks

concurrency:
  limit: 3

projects:
  example-project:
    path: /path/to/your/project
    engine: claude-code
    match_keywords: ["关键词1", "关键词2"]
    base_branch: main
    test_command: "npm test"
    build_command: "npm run build"
    knowledge:
      - path: /path/to/your/project/docs/
        label: 技术文档
        strategy: all
        include: "*.md"

engines:
  claude-code:
    command: claude
    args: ["--print", "--dangerously-skip-permissions"]
    timeout: 1800
    env:
      CLAUDE_MODEL: your-model-name
  codex:
    command: codex
    args: ["--quiet", "--auto-edit"]
    timeout: 1800
    env: {}
  default: claude-code

# 澄清由引擎自适应驱动（AI 自行决断问什么、问几轮），无需在此配固定维度。

# 仅当 adapters.store/notifier = feishu 时需要。
# 字段名需与 src/autocoder/adapters/feishu/store.py 的 _FIELD_MAP 对齐。
feishu:
  base_token: YOUR_BASE_TOKEN
  table_id: YOUR_TABLE_ID
  notify_chat_id: YOUR_CHAT_ID   # 发卡目标群，oc_ 开头
